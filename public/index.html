<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج الطلاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .search-wrapper {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideUp 0.6s ease-out;
      margin-bottom: 30px;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      text-align: center;
      color: white;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 30px;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .title span {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .search-box {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .search-input-wrapper {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 18px 25px;
      border: none;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      font-family: 'Cairo', sans-serif;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      color: #333;
    }

    .search-input-wrapper input:focus {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 1);
    }

    .search-input-wrapper input::placeholder {
      color: #999;
    }

    .btn-search {
      padding: 18px 40px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(245, 87, 108, 0.4);
      min-width: 120px;
    }

    .btn-search:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(245, 87, 108, 0.6);
    }

    .btn-search:active {
      transform: translateY(0);
    }

    .btn-search:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .results-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      margin-top: 30px;
    }

    .student-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .student-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
    }

    .student-name {
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .seat-number {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 15px;
      border-radius: 20px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .subjects-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 15px;
      margin: 15px 0;
    }

    .subject-item {
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      padding: 4px 0;
    }

    .subject-item .label {
      font-weight: 400;
    }

    .subject-item .value {
      font-weight: 600;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    .total-score {
      color: white;
      font-size: 1.1rem;
    }

    .total-score .number {
      font-weight: 800;
      font-size: 1.3rem;
    }

    .status-badge {
      padding: 5px 20px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .status-pass {
      background: rgba(46, 213, 115, 0.3);
      color: #2ed573;
      border: 1px solid rgba(46, 213, 115, 0.5);
    }

    .status-fail {
      background: rgba(255, 71, 87, 0.3);
      color: #ff4757;
      border: 1px solid rgba(255, 71, 87, 0.5);
    }

    .status-unknown {
      background: rgba(255, 165, 0, 0.3);
      color: #ffa502;
      border: 1px solid rgba(255, 165, 0, 0.5);
    }

    .no-results {
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.5rem;
      padding: 60px 20px;
      grid-column: 1 / -1;
      animation: fadeIn 0.5s ease-out;
    }

    .no-results .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 20px;
    }

    .error-message {
      text-align: center;
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.2);
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
      display: none;
    }

    @media (max-width: 768px) {
      .search-wrapper {
        padding: 25px;
      }

      .title {
        font-size: 1.8rem;
      }

      .search-box {
        flex-direction: column;
      }

      .search-input-wrapper {
        min-width: 100%;
      }

      .btn-search {
        width: 100%;
        min-width: unset;
      }

      .results-container {
        grid-template-columns: 1fr;
      }

      .subjects-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="search-wrapper">
      <h1 class="title">🔍 <span>بحث عن الطالب</span></h1>
      <div class="search-box">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" placeholder="أدخل رقم الجلوس أو اسم الطالب..." dir="auto">
        </div>
        <button class="btn-search" id="searchBtn">🔍 بحث</button>
      </div>
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <p style="color: white; margin-top: 10px; font-weight: 600;">جاري البحث...</p>
      </div>
      <div class="error-message" id="errorMessage"></div>
    </div>
    <div class="results-container" id="resultsContainer">
      <div class="no-results">
        <span class="emoji">📚</span>
        ابدأ البحث عن الطلاب
      </div>
    </div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsContainer = document.getElementById('resultsContainer');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const errorMessage = document.getElementById('errorMessage');

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        performSearch();
      }
    });

    searchBtn.addEventListener('click', performSearch);

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) {
        showError('الرجاء إدخال رقم جلوس أو اسم طالب');
        return;
      }

      hideError();
      loadingSpinner.style.display = 'block';
      searchBtn.disabled = true;

      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (!response.ok) {
          throw new Error('فشل البحث');
        }
        const data = await response.json();
        displayResults(data);
      } catch (error) {
        showError('حدث خطأ أثناء البحث. الرجاء المحاولة مرة أخرى.');
        console.error('Search error:', error);
      } finally {
        loadingSpinner.style.display = 'none';
        searchBtn.disabled = false;
      }
    }

    function displayResults(results) {
      resultsContainer.innerHTML = '';

      if (!results || results.length === 0) {
        resultsContainer.innerHTML = `
          <div class="no-results">
            <span class="emoji">😕</span>
            لا توجد نتائج مطابقة
          </div>
        `;
        return;
      }

      results.forEach((student, index) => {
        const statusClass = student.status === 'ناجح' || student.status === 'نجاح' ? 'status-pass' :
                           student.status === 'راسب' || student.status === 'رسوب' ? 'status-fail' :
                           'status-unknown';

        const card = document.createElement('div');
        card.className = 'student-card';
        card.style.animationDelay = `${index * 0.05}s`;

        card.innerHTML = `
          <div class="card-header">
            <span class="student-name">${student.student_name || 'غير معروف'}</span>
            <span class="seat-number">#${student.seat_number || 'N/A'}</span>
          </div>
          <div class="subjects-grid">
            <div class="subject-item"><span class="label">🇸🇦 عربي</span><span class="value">${student.arabic || 0}</span></div>
            <div class="subject-item"><span class="label">🇬🇧 إنجليزي</span><span class="value">${student.english || 0}</span></div>
            <div class="subject-item"><span class="label">🌐 لغة ثانية</span><span class="value">${student.second_language || 0}</span></div>
            <div class="subject-item"><span class="label">⚛️ فيزياء</span><span class="value">${student.physics || 0}</span></div>
            <div class="subject-item"><span class="label">🧪 كيمياء</span><span class="value">${student.chemistry || 0}</span></div>
            <div class="subject-item"><span class="label">🧬 أحياء</span><span class="value">${student.biology || 0}</span></div>
            <div class="subject-item"><span class="label">🗿 جيولوجيا</span><span class="value">${student.geology || 0}</span></div>
            <div class="subject-item"><span class="label">📐 رياضيات</span><span class="value">${student.math || 0}</span></div>
            <div class="subject-item"><span class="label">📊 إحصاء</span><span class="value">${student.statistics || 0}</span></div>
            <div class="subject-item"><span class="label">📜 تاريخ</span><span class="value">${student.history || 0}</span></div>
            <div class="subject-item"><span class="label">🌍 جغرافيا</span><span class="value">${student.geography || 0}</span></div>
            <div class="subject-item"><span class="label">🤔 فلسفة</span><span class="value">${student.philosophy || 0}</span></div>
            <div class="subject-item"><span class="label">🕌 دين</span><span class="value">${student.religion || 0}</span></div>
            <div class="subject-item"><span class="label">🏛️ قومي</span><span class="value">${student.national || 0}</span></div>
          </div>
          <div class="card-footer">
            <div class="total-score">
              <span>المجموع: </span>
              <span class="number">${student.total || 0}</span>
              <span style="font-size:0.9rem; color:rgba(255,255,255,0.7);"> (${student.percentage || 0}%)</span>
            </div>
            <div class="status-badge ${statusClass}">${student.status || 'غير محدد'}</div>
          </div>
        `;

        resultsContainer.appendChild(card);
      });
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    function hideError() {
      errorMessage.style.display = 'none';
    }
  </script>
</body>
</html>
