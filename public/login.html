<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.error {
            display: block;
            color: #721c24;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }
        .message.success {
            display: block;
            color: #155724;
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }
        .message.loading {
            display: block;
            color: #0c5460;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
        }
        .test-status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
        }
        .test-status .online {
            color: #28a745;
            font-weight: bold;
        }
        .test-status .offline {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 تسجيل الدخول</h2>
        <p class="subtitle">نظام إدارة نتائج الطلاب</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>👤 اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>🔑 كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" id="loginBtn">تسجيل الدخول</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="test-status">
            <span>حالة الخادم: </span>
            <span id="serverStatus" class="offline">جاري التحقق...</span>
        </div>
    </div>

    <script>
        // ============ TEST SERVER CONNECTION ============
        async function testServer() {
            const statusEl = document.getElementById('serverStatus');
            try {
                const response = await fetch('/api/test');
                if (response.ok) {
                    statusEl.textContent = '🟢 متصل';
                    statusEl.className = 'online';
                    return true;
                }
            } catch (error) {
                console.error('Server test error:', error);
            }
            statusEl.textContent = '🔴 غير متصل';
            statusEl.className = 'offline';
            return false;
        }

        // ============ SHOW MESSAGE ============
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }

        function hideMessage() {
            const msg = document.getElementById('message');
            msg.className = 'message';
            msg.textContent = '';
        }

        // ============ LOGIN FUNCTION ============
        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            
            hideMessage();
            
            if (!username || !password) {
                showMessage('⚠️ الرجاء إدخال اسم المستخدم وكلمة المرور', 'error');
                return;
            }
            
            // Show loading
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ جاري التحميل...';
            showMessage('⏳ جاري تسجيل الدخول...', 'loading');
            
            try {
                console.log('📤 Sending login request...');
                console.log('Username:', username);
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ 
                        username: username, 
                        password: password 
                    })
                });
                
                console.log('📥 Response status:', response.status);
                
                // Get response text first
                const responseText = await response.text();
                console.log('📥 Response text:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('❌ Failed to parse JSON:', parseError);
                    showMessage('❌ خطأ في استجابة الخادم', 'error');
                    return;
                }
                
                console.log('📥 Parsed data:', data);
                
                if (response.ok && data.success) {
                    // Save token
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', data.username || username);
                        console.log('✅ Token saved successfully');
                    }
                    
                    showMessage('✅ تم تسجيل الدخول بنجاح! جاري التحويل...', 'success');
                    
                    // Redirect with token in URL for dashboard to pick up
                    setTimeout(() => {
                        const token = data.token || localStorage.getItem('token');
                        if (token) {
                            window.location.href = '/dashboard?token=' + encodeURIComponent(token);
                        } else {
                            window.location.href = '/dashboard';
                        }
                    }, 1000);
                    
                } else {
                    showMessage(data.error || '❌ فشل تسجيل الدخول - تأكد من اسم المستخدم وكلمة المرور', 'error');
                }
                
            } catch (error) {
                console.error('❌ Login error:', error);
                showMessage('❌ حدث خطأ في الاتصال: ' + error.message, 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'تسجيل الدخول';
            }
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        // ============ TEST ON LOAD ============
        testServer();

        // ============ CONSOLE HELP ============
        console.log('🔧 For testing, use:');
        console.log('  ✅ Test server: testServer()');
        console.log('  ✅ Test login: fetch("/api/login", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:"admin",password:"admin123"})}).then(r=>r.json()).then(console.log)');
    </script>
</body>
</html>
