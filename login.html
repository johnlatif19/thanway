<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 30px;
      padding: 50px 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-icon {
      font-size: 4rem;
      display: block;
      margin-bottom: 15px;
    }

    .login-title {
      color: white;
      font-size: 2rem;
      font-weight: 800;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .login-subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
      margin-top: 8px;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      color: #333;
      direction: ltr;
    }

    .form-group input:focus {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 1);
    }

    .form-group input::placeholder {
      color: #aaa;
    }

    .btn-login {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
      margin-top: 10px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 12px 35px rgba(245, 87, 108, 0.6);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff6b6b;
      padding: 12px 18px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      display: none;
    }

    .loading-spinner {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .login-footer {
      text-align: center;
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.9rem;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 25px;
      }

      .login-title {
        font-size: 1.6rem;
      }

      .form-group input {
        padding: 14px 18px;
      }

      .btn-login {
        padding: 16px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span class="login-icon">🔐</span>
        <h1 class="login-title">تسجيل الدخول</h1>
        <p class="login-subtitle">لوحة تحكم نتائج الطلاب</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label>👤 اسم المستخدم</label>
          <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
        </div>

        <div class="form-group">
          <label>🔑 كلمة المرور</label>
          <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-login" id="loginBtn">🚀 تسجيل الدخول</button>
      </form>

      <div class="error-message" id="errorMessage"></div>
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
      </div>

      <div class="login-footer">
        نظام إدارة نتائج الطلاب
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    const loadingSpinner = document.getElementById('loadingSpinner');

    // Check if already logged in
    async function checkAuth() {
      try {
        const response = await fetch('/api/check-auth');
        const data = await response.json();
        if (data.authenticated) {
          window.location.href = '/dashboard.html';
        }
      } catch (error) {
        console.error('Auth check error:', error);
      }
    }
    checkAuth();

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
        return;
      }

      hideError();
      loginBtn.disabled = true;
      loadingSpinner.style.display = 'block';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password }),
          credentials: 'same-origin'
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = '/dashboard.html';
        } else {
          showError(data.error || 'اسم المستخدم أو كلمة المرور غير صحيحة');
        }
      } catch (error) {
        showError('حدث خطأ في الاتصال. الرجاء المحاولة مرة أخرى.');
        console.error('Login error:', error);
      } finally {
        loginBtn.disabled = false;
        loadingSpinner.style.display = 'none';
      }
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    function hideError() {
      errorMessage.style.display = 'none';
    }
  </script>
</body>
</html>
